services:
  web:
    image: nginx:alpine
    volumes:
      - previews_data:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ssh
    deploy:
      resources:
        limits:
          cpus: '0.25'   # Teto máximo: Apenas 25% de 1 núcleo (é mais que suficiente)
          memory: 128M   # Nginx consome raramente mais que 50MB de RAM
        reservations:
          cpus: '0.05'   # Garante o mínimo do mínimo para iniciar
          memory: 32M

  ssh:
    image: ghcr.io/alexsilva-dev/leads-previews-cdn/ssh-server:latest
    pull_policy: always
    ports:
      - "2222:22"
    volumes:
      - previews_data:/app
      - .:/opencode-config:ro
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - SSH_PASSWORD=${SSH_PASSWORD:-password}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.55'   # Teto máximo: Apenas 25% de 1 núcleo (é mais que suficiente)
          memory: 128M   # Nginx consome raramente mais que 50MB de RAM
        reservations:
          cpus: '0.05'   # Garante o mínimo do mínimo para iniciar
          memory: 32M

volumes:
  previews_data:
